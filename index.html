<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro - Mensal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --primary: #059669;
            --primary-hover: #047857;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-line: #f1f5f9;
            --row-even: #ffffff;
            --row-odd: #f8fafc;
            --row-selected: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-color);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-line);
            width: 100%;
            flex-shrink: 0;
            gap: 15px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .tabs-container {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .tab-button {
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-line);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-button:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .tab-button.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 2px 4px rgba(5, 150, 105, 0.2);
        }

        .resumo-bar {
            display: flex;
            gap: 15px;
            padding: 10px 20px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-line);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .resumo-card {
            background: #ffffff;
            border: 1px solid var(--border-line);
            padding: 8px 14px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 180px;
        }

        .resumo-card .card-title {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .resumo-card .card-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .filters-bar {
            background: var(--surface-color);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-line);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            width: 100%;
            flex-shrink: 0;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f8fafc;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-line);
        }

        .filter-group select, .filter-group input {
            border: 1px solid var(--border-line);
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 0.78rem;
            outline: none;
            color: var(--text-main);
            background: #ffffff;
        }

        .filter-group input[type="text"] {
            width: 180px;
        }

        .filter-group select {
            cursor: pointer;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover { background: var(--primary-hover); }

        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-line);
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.75rem;
        }

        .table-container {
            flex: 1;
            width: 100vw;
            background: var(--surface-color);
            overflow-y: auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 2200px; /* Amplo espaço para as 18 colunas */
            table-layout: auto;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        th, td {
            padding: 10px 14px;
            text-align: center;
            border: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        thead th {
            background: #ffffff;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-line);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.03em;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr:nth-child(even) { background-color: var(--row-even); }
        tbody tr:nth-child(odd) { background-color: var(--row-odd); }
        tbody tr { cursor: pointer; transition: background-color 0.1s ease; }
        tbody tr:hover { background-color: #e2e8f0; }
        tbody tr.linha-selecionada { background-color: var(--row-selected) !important; font-weight: 500; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(2px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--surface-color);
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-line);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-header h2 { font-size: 0.95rem; font-weight: 700; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .form-group.full-width { grid-column: span 3; }
        .form-group.half-width { grid-column: span 2; }
        .form-group label { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .form-group input, .form-group select {
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-line);
            outline: none;
            font-size: 0.78rem;
            background: #f8fafc;
            width: 100%;
        }

        .modal-footer { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; }
        #statusNuvem { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
    </style>
</head>
<body onload="carregarDados()">

    <div class="container">
        <header>
            <div class="header-controls">
                <div class="tabs-container" id="tabsNav"></div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span id="statusNuvem">Sincronizando...</span>
                    <button class="btn" onclick="abrirModalAdicionar()">+ Adicionar Item</button>
                </div>
            </div>
        </header>

        <div class="resumo-bar">
            <div class="resumo-card">
                <span class="card-title">Soma Parcela</span>
                <span class="card-value" id="resumoSomaTotal">R$ 0,00</span>
            </div>
            <div class="resumo-card">
                <span class="card-title">Qtd. Lançamentos</span>
                <span class="card-value" id="resumoQtdLançamentos">0</span>
            </div>
            <div class="resumo-card">
                <span class="card-title">Total Status "C"</span>
                <span class="card-value" id="resumoSomaStatusC">R$ 0,00</span>
            </div>
        </div>

        <div class="filters-bar">
            <div class="filter-group">
                <input type="text" id="inputPesquisa" oninput="renderizarTabela()" placeholder="Pesquisar...">
            </div>
            <div class="filter-group">
                <select id="filtroStatus" onchange="renderizarTabela()">
                    <option value="">Todos Status</option>
                </select>
            </div>
            <div class="filter-group">
                <input type="date" id="dataInicio" onchange="renderizarTabela()">
                <span>até</span>
                <input type="date" id="dataFim" onchange="renderizarTabela()">
            </div>
            <button class="btn btn-sm" onclick="filtrarMesAtual()">📅 Mês Atual</button>
            <button class="btn btn-sm" style="background: #2563eb;" onclick="filtrarStatusC()">⭐ Status (C)</button>
            <button class="btn-outline btn btn-sm" onclick="removerTodosFiltros()">✕ Limpar Filtros</button>
        </div>

        <div class="table-container">
            <table>
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal (Adicionar / Editar) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitulo">Adicionar Novo Item</h2>
                <button class="btn-outline btn btn-sm" onclick="fecharModal()">✕</button>
            </div>
            <form id="dataForm" onsubmit="salvarRegistro(event)">
                <input type="hidden" id="fIndiceOriginal">
                <div class="form-grid" id="modalFormGrid"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn" id="btnSalvarModal">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzMSr4YxW90lYjK-2pAJQ5gYVOnVSn0yDsTWYvN0ulz_QjBQZMCWFhyXwYP7rX2u-Fp/exec';
        
        const CABECALHOS_MENSAL = [
            "ANO", "MÊS", "TIPO DE PGTO.", "PRODUTO", "LOCAL", "PESSOA", 
            "DATA ADQUIRIDO", "DATA DE PAG.", "DATA FECH. FATURA", "VALOR DA PARCELA", 
            "VALOR TOTAL", "PARCELA", "TOTAL DE PARCELAS", "DESCONTO", 
            "OBS E COMPROVAN.", "RECEBER", "PAGAR", "STATUS"
        ];

        let dadosBrutos = [];
        let abaSelecionada = '';
        let linhasSelecionadasIndices = new Set();
        let ultimoIndiceClicado = null;

        function converterParaNumero(valor) {
            if (valor === null || valor === undefined || valor === '') return 0;
            if (typeof valor === 'number') return valor;
            let str = valor.toString().trim();
            str = str.replace(/R\$/g, '').replace(/\s/g, '');
            if (str.includes(',') && str.includes('.')) {
                str = str.replace(/\./g, '').replace(',', '.');
            } else if (str.includes(',')) {
                str = str.replace(',', '.');
            }
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        function parseDataParaDateObj(valor) {
            if (!valor) return null;
            const str = valor.toString().trim();
            if (str.includes('/')) {
                const p = str.split('/');
                if (p.length === 3) return new Date(p[2], p[1] - 1, p[0]);
            }
            if (str.includes('-')) {
                const p = str.split('T')[0].split('-');
                if (p.length === 3) return new Date(p[0], p[1] - 1, p[2]);
            }
            const dtNum = Number(str);
            if (!isNaN(dtNum) && dtNum > 30000) {
                return new Date((dtNum - (25567 + 2)) * 86400 * 1000);
            }
            return null;
        }

        function formatarDataExibicao(valor) {
            const dt = parseDataParaDateObj(valor);
            if (!dt || isNaN(dt.getTime())) return valor || '';
            const dia = String(dt.getDate()).padStart(2, '0');
            const mes = String(dt.getMonth() + 1).padStart(2, '0');
            const ano = dt.getFullYear();
            return `${dia}/${mes}/${ano}`;
        }

        function formatarMoedaExcel(valor) {
            const num = converterParaNumero(valor);
            const numeroFormatado = num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return `<span style="display:flex; justify-content:space-between; width:100%;"><span>R$</span><span>${numeroFormatado}</span></span>`;
        }

        function formatarSimples(val) {
            const n = converterParaNumero(val);
            return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        async function carregarDados(nomeAba = '') {
            const statusEl = document.getElementById('statusNuvem');
            statusEl.innerText = "Sincronizando...";
            try {
                const url = nomeAba ? `${WEB_APP_URL}?aba=${encodeURIComponent(nomeAba)}` : WEB_APP_URL;
                const resp = await fetch(url);
                const jsonResp = await resp.json();

                if (jsonResp.erro) {
                    alert(jsonResp.erro);
                    statusEl.innerText = "Erro ao carregar";
                    return;
                }

                dadosBrutos = jsonResp.dados || [];
                abaSelecionada = jsonResp.abaAtual;

                renderizarBotoesAbas(jsonResp.todasAbas, jsonResp.abaAtual);
                
                // Se for a aba Mensal e estiver vazia, injeta o cabeçalho padrão
                if ((!dadosBrutos || dadosBrutos.length === 0) && abaSelecionada.toLowerCase() === 'mensal') {
                    dadosBrutos = [CABECALHOS_MENSAL];
                }

                popularFiltrosCabecalho();
                renderizarTabela();
                statusEl.innerText = "Online";
            } catch (err) {
                console.error("Erro:", err);
                statusEl.innerText = "Erro de conexão";
            }
        }

        function renderizarBotoesAbas(todasAbas, abaAtual) {
            const tabsContainer = document.getElementById('tabsNav');
            if (!todasAbas || todasAbas.length === 0) return;

            tabsContainer.innerHTML = todasAbas.map(nome => {
                const isActive = nome === abaAtual ? 'active' : '';
                return `<button class="tab-button ${isActive}" onclick="trocarAba('${nome}')">📄 ${nome}</button>`;
            }).join('');
        }

        function trocarAba(nomeAba) {
            if (nomeAba === abaSelecionada) return;
            removerTodosFiltros();
            carregarDados(nomeAba);
        }

        function popularFiltrosCabecalho() {
            const statusSet = new Set();
            let temStatusVazio = false;
            
            const isMensal = abaSelecionada.toLowerCase() === 'mensal';
            const colStatusIdx = isMensal ? 17 : 5;

            dadosBrutos.slice(1).forEach(row => {
                const valStatus = row[colStatusIdx];
                if (valStatus !== null && valStatus !== undefined && valStatus.toString().trim() !== '') {
                    statusSet.add(valStatus.toString().trim());
                } else {
                    temStatusVazio = true;
                }
            });

            const selectStatus = document.getElementById('filtroStatus');
            const valorAtualStatus = selectStatus.value;
            selectStatus.innerHTML = `<option value="">Todos Status</option>`;
            if (temStatusVazio) {
                const optVazio = document.createElement('option');
                optVazio.value = "VAZIO_VAL";
                optVazio.innerText = "(Em branco)";
                selectStatus.appendChild(optVazio);
            }
            Array.from(statusSet).sort().forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.innerText = item;
                selectStatus.appendChild(opt);
            });
            selectStatus.value = valorAtualStatus;
        }

        function removerTodosFiltros() {
            document.getElementById('inputPesquisa').value = '';
            document.getElementById('filtroStatus').value = '';
            document.getElementById('dataInicio').value = '';
            document.getElementById('dataFim').value = '';
            renderizarTabela();
        }

        function filtrarMesAtual() {
            const agora = new Date();
            const ano = agora.getFullYear();
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ultimoDia = new Date(ano, agora.getMonth() + 1, 0).getDate();
            
            document.getElementById('dataInicio').value = `${ano}-${mes}-01`;
            document.getElementById('dataFim').value = `${ano}-${mes}-${ultimoDia}`;
            renderizarTabela();
        }

        function filtrarStatusC() {
            const selectStatus = document.getElementById('filtroStatus');
            for (let i = 0; i < selectStatus.options.length; i++) {
                if (selectStatus.options[i].value.toUpperCase() === 'C') {
                    selectStatus.selectedIndex = i;
                    break;
                }
            }
            renderizarTabela();
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tableBody');
            const thead = document.getElementById('tableHeader');

            const isMensal = abaSelecionada.toLowerCase() === 'mensal';
            const cabecalhos = isMensal ? CABECALHOS_MENSAL : (dadosBrutos[0] || []);

            thead.innerHTML = `<tr>${cabecalhos.map(col => `<th>${col}</th>`).join('')}</tr>`;

            const textoPesquisa = document.getElementById('inputPesquisa').value.toLowerCase().trim();
            const filtroSta = document.getElementById('filtroStatus').value;
            const inputInicio = document.getElementById('dataInicio').value;
            const inputFim = document.getElementById('dataFim').value;
            const dInicio = inputInicio ? new Date(inputInicio + "T00:00:00") : null;
            const dFim = inputFim ? new Date(inputFim + "T23:59:59") : null;

            const colDataIdx = isMensal ? 6 : 0; // Data Adquirido na Mensal
            const colValorIdx = isMensal ? 9 : 3; // Valor da Parcela na Mensal
            const colStatusIdx = isMensal ? 17 : 5; // Status na Mensal

            let linhasFiltradasComIndice = dadosBrutos.slice(1).map((row, originalIndex) => ({ row, originalIndex })).filter(item => {
                const row = item.row;
                
                if (dInicio || dFim) {
                    const dtLinha = parseDataParaDateObj(row[colDataIdx]);
                    if (dtLinha) {
                        if (dInicio && dtLinha < dInicio) return false;
                        if (dFim && dtLinha > dFim) return false;
                    }
                }

                if (filtroSta !== "") {
                    const valStatusRow = row[colStatusIdx] !== null && row[colStatusIdx] !== undefined ? row[colStatusIdx].toString().trim() : "";
                    if (filtroSta === "VAZIO_VAL") {
                        if (valStatusRow !== "") return false;
                    } else {
                        if (valStatusRow !== filtroSta) return false;
                    }
                }

                if (textoPesquisa) {
                    const linhaMatch = row.some(cell => {
                        if (cell === null || cell === undefined) return false;
                        return cell.toString().toLowerCase().includes(textoPesquisa);
                    });
                    if (!linhaMatch) return false;
                }
                return true;
            });

            let somaTotal = 0;
            let somaStatusC = 0;

            linhasFiltradasComIndice.forEach(item => {
                const row = item.row;
                const valNum = converterParaNumero(row[colValorIdx]);
                somaTotal += valNum;
                const statusStr = (row[colStatusIdx] || '').toString().trim().toUpperCase();
                if (statusStr === 'C' || statusStr.includes('C')) {
                    somaStatusC += valNum;
                }
            });

            document.getElementById('resumoSomaTotal').innerText = formatarSimples(somaTotal);
            document.getElementById('resumoQtdLançamentos').innerText = linhasFiltradasComIndice.length;
            document.getElementById('resumoSomaStatusC').innerText = formatarSimples(somaStatusC);

            tbody.innerHTML = linhasFiltradasComIndice.map((item, indexVisual) => {
                const row = item.row;
                const originalIndex = item.originalIndex;
                const trId = `row-${indexVisual}`;
                const isSelected = linhasSelecionadasIndices.has(indexVisual) ? 'linha-selecionada' : '';
                
                return `<tr id="${trId}" class="${isSelected}" onclick="selecionarLinha(${indexVisual}, event)" ondblclick="abrirModalEditar(${originalIndex})">
                    ${cabecalhos.map((_, idx) => {
                        const cell = row[idx];
                        let val = '';
                        if (isMensal && [6, 7, 8].includes(idx)) {
                            val = formatarDataExibicao(cell);
                        } else if (isMensal && [9, 10, 13, 15, 16].includes(idx)) {
                            val = formatarMoedaExcel(cell);
                        } else if (!isMensal && idx === 3) {
                            val = formatarMoedaExcel(cell);
                        } else {
                            val = (cell !== null && cell !== undefined ? cell : '');
                        }
                        return `<td title="${val}">${val}</td>`;
                    }).join('')}
                </tr>`;
            }).join('');
        }

        function selecionarLinha(index, event) {
            const isCtrlPressed = event.ctrlKey || event.metaKey;
            const isShiftPressed = event.shiftKey;
            if (isShiftPressed && ultimoIndiceClicado !== null) {
                const inicio = Math.min(ultimoIndiceClicado, index);
                const fim = Math.max(ultimoIndiceClicado, index);
                if (!isCtrlPressed) { linhasSelecionadasIndices.clear(); }
                for (let i = inicio; i <= fim; i++) { linhasSelecionadasIndices.add(i); }
            } else if (isCtrlPressed) {
                if (linhasSelecionadasIndices.has(index)) { linhasSelecionadasIndices.delete(index); }
                else { linhasSelecionadasIndices.add(index); }
                ultimoIndiceClicado = index;
            } else {
                linhasSelecionadasIndices.clear();
                linhasSelecionadasIndices.add(index);
                ultimoIndiceClicado = index;
            }
            renderizarTabela();
        }

        function construirFormularioModal(rowData = null) {
            const grid = document.getElementById('modalFormGrid');
            const isMensal = abaSelecionada.toLowerCase() === 'mensal';
            const cabecalhos = isMensal ? CABECALHOS_MENSAL : ["Data", "Categoria", "Descritivo", "Valor", "Tipo", "Status"];

            grid.innerHTML = cabecalhos.map((col, idx) => {
                const valorAtual = rowData ? (rowData[idx] || '') : '';
                let isFullWidth = (col.includes('OBS') || col === 'PRODUTO') ? 'full-width' : '';

                if (col.includes('DATA')) {
                    let dtFormatted = '';
                    if (valorAtual) {
                        const dtObj = parseDataParaDateObj(valorAtual);
                        if (dtObj && !isNaN(dtObj.getTime())) {
                            dtFormatted = `${dtObj.getFullYear()}-${String(dtObj.getMonth() + 1).padStart(2, '0')}-${String(dtObj.getDate()).padStart(2, '0')}`;
                        }
                    }
                    return `
                        <div class="form-group ${isFullWidth}">
                            <label>${col}</label>
                            <input type="date" id="f_col_${idx}" value="${dtFormatted}">
                        </div>`;
                }

                return `
                    <div class="form-group ${isFullWidth}">
                        <label>${col}</label>
                        <input type="text" id="f_col_${idx}" value="${valorAtual}" placeholder="${col}">
                    </div>`;
            }).join('');
        }

        function abrirModalAdicionar() {
            document.getElementById('dataForm').reset();
            document.getElementById('fIndiceOriginal').value = "";
            document.getElementById('modalTitulo').innerText = "Adicionar Item - (" + abaSelecionada + ")";
            document.getElementById('btnSalvarModal').innerText = "Salvar Registro";
            construirFormularioModal();
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function abrirModalEditar(originalIndex) {
            const rowData = dadosBrutos[originalIndex + 1];
            if (!rowData) return;

            document.getElementById('fIndiceOriginal').value = originalIndex + 2;
            document.getElementById('modalTitulo').innerText = "Editar Registro - (" + abaSelecionada + ")";
            document.getElementById('btnSalvarModal').innerText = "Atualizar Registro";
            
            construirFormularioModal(rowData);
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        async function salvarRegistro(event) {
            event.preventDefault();
            const isMensal = abaSelecionada.toLowerCase() === 'mensal';
            const totalCols = isMensal ? 18 : 6;
            const linhaEditando = document.getElementById('fIndiceOriginal').value;

            const payload = {
                aba: abaSelecionada,
                acao: linhaEditando ? "EDITAR" : "INSERIR",
                linha: linhaEditando || ""
            };

            for (let i = 0; i < totalCols; i++) {
                const el = document.getElementById(`f_col_${i}`);
                let val = el ? el.value : '';
                if (el && el.type === 'date' && val.includes('-')) {
                    const p = val.split('-');
                    val = `${p[2]}/${p[1]}/${p[0]}`;
                }
                payload[`col${i + 1}`] = val;
            }

            document.getElementById('statusNuvem').innerText = "Salvando...";
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                fecharModal();
                setTimeout(() => carregarDados(abaSelecionada), 1200);
            } catch (err) {
                console.error("Erro ao salvar:", err);
                alert("Erro ao salvar dados.");
            }
        }
    </script>
</body>
</html>
